spring:
  application:
    name: API-GATEWAY
  config:
    import: optional:configserver:http://localhost:9296
  cloud:
    gateway:
      routes:
        - id: PRODUCT-SERVICE
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: PRODUCT-SERVICE
                fallbackUri: forward:/productServiceFallBack

#            - name: RequestRateLimiter
#              args:
#                redis-rate-replenishRate: 1
#                redis-rate-limiter-burstCapacity: 1

        - id: PAYMENT-SERVICE
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment/**
          filters:
            - name: CircuitBreaker
              args:
                name: PAYMENT-SERVICE
                fallbackUri: forward:/paymentServiceFallBack

#            - name: RequestRateLimiter
#              args:
#                redis-rate-replenishRate: 1
#                redis-rate-limiter-burstCapacity: 1

        - id: ORDER-SERVICE
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: ORDER-SERVICE
                fallbackUri: forward:/orderServiceFallBack

#            - name: RequestRateLimiter
#              args:
#                redis-rate-replenishRate: 1
#                redis-rate-limiter-burstCapacity: 1

server:
  port: 9090
